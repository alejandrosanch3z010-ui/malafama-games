<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mala Fama Games" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="brillo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1244"/>
      <stop offset="1" stop-color="#0a0a22"/>
    </linearGradient>
  </defs>
  <!-- Placa del letrero -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#fondo)"/>
  <!-- Tubo de neón rosa del marco -->
  <rect x="7" y="7" width="50" height="50" rx="12" fill="none" stroke="#ff3fa4" stroke-width="2.6" filter="url(#brillo)"/>
  <!-- M con cuernos: la "mala fama" -->
  <g fill="none" stroke="#45f3ff" stroke-linecap="round" stroke-linejoin="round" filter="url(#brillo)">
    <path d="M19 47V25l13 13 13-13v22" stroke-width="4.6"/>
  </g>
  <g fill="#45f3ff" filter="url(#brillo)">
    <path d="M16.6 27C13.4 21.5 13 15.8 16.2 11.2C17.2 16.2 19.4 20.3 22.4 23.6Z"/>
    <path d="M47.4 27C50.6 21.5 51 15.8 47.8 11.2C46.8 16.2 44.6 20.3 41.6 23.6Z"/>
